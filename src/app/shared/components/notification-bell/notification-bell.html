<div class="relative">
  <!-- Bell Icon Button -->
  <button
    type="button"
    (click)="togglePanel()"
    class="relative p-2 text-white hover:text-blue-100 focus:outline-none focus:ring-2 focus:ring-blue-300 rounded-lg transition-colors duration-200"
    [attr.aria-label]="
      'Notifications' + (hasUnread() ? ' (' + unreadCount() + ' unread)' : '')
    "
  >
    <!-- Bell Icon (Heroicons Bell) -->
    <svg
      class="w-6 h-6"
      fill="none"
      stroke="currentColor"
      viewBox="0 0 24 24"
      [class.animate-bell-ring]="hasUnread()"
    >
      <path
        stroke-linecap="round"
        stroke-linejoin="round"
        stroke-width="2"
        d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"
      />
    </svg>

    <!-- Unread Badge -->
    @if (hasUnread()) {
      <span
        class="absolute top-0 right-0 inline-flex items-center justify-center px-1.5 py-0.5 text-xs font-bold leading-none text-white transform translate-x-1/2 -translate-y-1/2 bg-red-600 rounded-full min-w-5"
      >
        {{ getDisplayCount() }}
      </span>
    }
  </button>

  <!-- Notification Panel -->
  @if (isPanelOpen()) {
    <div class="absolute right-0 mt-2 z-50">
      <app-notification-panel (buttonClose)="closePanel()" />
    </div>
  }

  <!-- Backdrop (closes panel when clicking outside) -->
  @if (isPanelOpen()) {
    <div
      role="button"
      tabindex="0"
      aria-label="Fermer le panneau"
      class="fixed inset-0 z-40"
      (click)="closePanel()"
      (keydown.enter)="closePanel()"
      (keydown.space)="closePanel(); $event.preventDefault()"
      (keydown.escape)="closePanel()"
    ></div>
  }
</div>
