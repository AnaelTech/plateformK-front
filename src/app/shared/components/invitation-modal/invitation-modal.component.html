<div
  class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4"
  role="dialog"
  aria-modal="true"
  [attr.aria-labelledby]="modalTitleId"
  (click)="onClose()"
  (keydown.escape)="onClose()"
  tabindex="-1"
>
  <div
    class="bg-white rounded-xl shadow-xl max-w-md w-full p-6"
    role="document"
    (click)="$event.stopPropagation()"
    (keydown)="$event.stopPropagation()"
    tabindex="0"
  >
    <div class="flex items-center justify-between mb-6">
      <h3 [id]="modalTitleId" class="text-xl font-bold text-gray-900">
        {{ title() }}
      </h3>
      <button
        type="button"
        (click)="onClose()"
        aria-label="Fermer la modale"
        class="text-gray-400 hover:text-gray-600 transition-colors"
      >
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </div>

    @if (successMessage()) {
      <div class="mb-4 p-4 bg-green-50 border border-green-200 rounded-lg">
        <div class="flex items-center gap-2 text-green-800">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
          </svg>
          <span class="font-medium">{{ successMessage() }}</span>
        </div>
      </div>
    }

    @if (errorMessage()) {
      <div class="mb-4 p-4 bg-red-50 border border-red-200 rounded-lg">
        <div class="flex items-center gap-2 text-red-800">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
          </svg>
          <span class="font-medium">{{ errorMessage() }}</span>
        </div>
      </div>
    }

    <div class="space-y-4">
      <p class="text-sm text-gray-600">{{ description() }}</p>

      <div>
        <label for="invitationEmailInput" class="block text-sm font-medium text-gray-700 mb-2">
          {{ emailLabel() }}
        </label>
        <input
          type="email"
          id="invitationEmailInput"
          [value]="email()"
          (input)="email.set($any($event.target).value)"
          placeholder="exemple@email.com"
          class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
          [disabled]="loading()"
        />
      </div>

      <div class="flex gap-3 pt-4">
        <button
          type="button"
          (click)="onClose()"
          class="flex-1 px-4 py-2 border border-gray-300 text-gray-700 rounded-lg font-medium hover:bg-gray-50 transition-colors"
          [disabled]="loading()"
        >
          Annuler
        </button>
        <button
          type="button"
          (click)="onSend()"
          class="flex-1 px-4 py-2 bg-blue-600 text-white rounded-lg font-medium hover:bg-blue-700 disabled:bg-gray-400 disabled:cursor-not-allowed transition-colors flex items-center justify-center gap-2"
          [disabled]="loading() || !email()"
        >
          @if (loading()) {
            <svg class="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            <span>Envoi...</span>
          } @else {
            <span>Envoyer l'invitation</span>
          }
        </button>
      </div>
    </div>
  </div>
</div>
