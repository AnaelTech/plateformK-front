<!-- ========================================
         NAVIGATION - BURGER MOBILE / TABS DESKTOP
         ======================================== -->
<div class="bg-white shadow">
  <div class="max-w-7xl mx-auto px-3 sm:px-4 lg:px-8">
    <div class="flex items-center justify-between py-3 sm:py-0">
      <!-- Titre de la section active (Mobile uniquement) -->
      <div class="sm:hidden flex items-center gap-2">
        <h2 class="text-lg font-bold text-gray-900">
          {{ getActiveTabLabel() }}
        </h2>
      </div>

      <!-- Bouton Burger (Mobile uniquement) -->
      <button
        (click)="toggleMenu()"
        class="sm:hidden p-2 rounded-lg hover:bg-gray-100 active:bg-gray-200 transition-colors"
        [attr.aria-label]="showMenu() ? 'Fermer le menu' : 'Ouvrir le menu'"
        [attr.aria-expanded]="showMenu()"
      >
        <svg
          class="w-6 h-6 text-gray-700"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
        >
          @if (!showMenu()) {
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M4 6h16M4 12h16M4 18h16"
            />
          } @else {
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M6 18L18 6M6 6l12 12"
            />
          }
        </svg>
      </button>

      <!-- Tabs Desktop (masqué sur mobile) -->
      <div class="hidden sm:flex gap-2 overflow-x-auto pb-0.5 scrollbar-hide">
        @for (tab of tabs(); track tab.id) {
          <button
            (click)="selectTab(tab.id)"
            [class]="
              'px-6 py-4 text-sm font-semibold transition-all duration-200 border-b-2 whitespace-nowrap ' +
              (activeTab() === tab.id
                ? 'text-' + color() + '-600 border-' + color() + '-600'
                : 'text-gray-600 border-transparent hover:text-gray-900 cursor-pointer')
            "
          >
            <div class="flex items-center gap-2">
              <svg
                class="w-5 h-5"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  [attr.d]="tab.icon"
                />
              </svg>
              <span>{{ tab.label }}</span>
            </div>
          </button>
        }
      </div>
    </div>
  </div>
</div>

<!-- Menu Mobile (Drawer coulissant) -->
@if (showMenu()) {
  <!-- Overlay -->
  <div
    role="button"
    tabindex="0"
    aria-label="Fermer le menu"
    class="fixed inset-0 bg-transparent bg-opacity-50 z-40 sm:hidden animate-fade-in"
    (click)="toggleMenu()"
    (keydown.enter)="toggleMenu()"
    (keydown.space)="toggleMenu(); $event.preventDefault()"
    (keydown.escape)="toggleMenu()"
  ></div>

  <!-- Menu drawer -->
  <div
    class="fixed top-0 right-0 bottom-0 w-72 bg-white shadow-xl z-50 sm:hidden animate-slide-in-right"
  >
    <div class="p-4 border-b border-gray-200 flex items-center justify-between">
      <h3 class="text-lg font-bold text-gray-900">Menu</h3>
      <button
        (click)="toggleMenu()"
        class="p-2 rounded-lg hover:bg-gray-100 active:bg-gray-200"
        aria-label="Fermer le menu"
      >
        <svg
          class="w-5 h-5 text-gray-700"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M6 18L18 6M6 6l12 12"
          />
        </svg>
      </button>
    </div>

    <nav class="p-2">
      @for (tab of tabs(); track tab.id) {
        <button
          (click)="selectTab(tab.id)"
          [class]="
            'w-full flex items-center gap-3 px-4 py-3 rounded-lg text-left transition-colors mb-1 ' +
            (activeTab() === tab.id
              ? 'bg-' + color() + '-50 text-' + color() + '-600 font-semibold'
              : 'text-gray-700 hover:bg-gray-50 active:bg-gray-100')
          "
        >
          <svg
            class="w-5 h-5 shrink-0"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              [attr.d]="tab.icon"
            />
          </svg>
          <span>{{ tab.label }}</span>
        </button>
      }
    </nav>
  </div>
}
