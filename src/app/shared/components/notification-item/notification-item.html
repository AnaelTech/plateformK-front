<div
  role="article"
  [attr.aria-label]="'Notification: ' + notification.title"
  [attr.aria-describedby]="'notification-message-' + notification.id"
  tabindex="0"
  class="flex items-start gap-3 p-4 border-b border-gray-200 cursor-pointer transition-colors duration-200 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-inset"
  [class]="getBackgroundClass()"
  (click)="onNotificationClick()"
  (keydown.enter)="onNotificationClick()"
  (keydown.space)="onNotificationClick(); $event.preventDefault()"
>
  <!-- Icon -->
  <div
    class="shrink-0 w-10 h-10 rounded-full flex items-center justify-center"
    [ngClass]="notification.status === 'UNREAD' ? 'bg-blue-100' : 'bg-gray-100'"
    aria-hidden="true"
  >
    <svg
      class="w-5 h-5"
      [ngClass]="colorClass()"
      fill="none"
      stroke="currentColor"
      viewBox="0 0 24 24"
      aria-hidden="true"
    >
      @switch (icon()) {
        @case ("check-circle") {
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"
          />
        }
        @case ("x-circle") {
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z"
          />
        }
        @case ("calendar") {
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"
          />
        }
        @case ("file-text") {
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"
          />
        }
        @case ("clock") {
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"
          />
        }
        @case ("alert-triangle") {
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"
          />
        }
        @case ("dollar-sign") {
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"
          />
        }
        @case ("check") {
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M5 13l4 4L19 7"
          />
        }
        @default {
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"
          />
        }
      }
    </svg>
  </div>

  <!-- Content -->
  <div class="flex-1 min-w-0">
    <!-- Title -->
    <div class="flex items-start justify-between gap-2">
      <h4
        class="text-sm font-medium text-gray-900 line-clamp-2"
        [class.font-semibold]="notification.status === 'UNREAD'"
      >
        {{ notification.title }}
      </h4>

      @if (notification.status === "UNREAD") {
        <span
          class="shrink-0 w-2 h-2 bg-blue-600 rounded-full mt-1"
          role="status"
          aria-label="Non lue"
        ></span>
      }
    </div>

    <!-- Message -->
    <p
      [id]="'notification-message-' + notification.id"
      class="mt-1 text-sm text-gray-600 line-clamp-2"
    >
      {{ notification.message }}
    </p>

    <!-- Time and Actions -->
    <div class="mt-2 flex items-center justify-between">
      <time
        [attr.datetime]="notification.createdAt"
        class="text-xs text-gray-500"
      >
        {{ relativeTime() }}
      </time>

      <div
        class="flex items-center gap-2"
        role="group"
        aria-label="Actions de notification"
      >
        <!-- Mark as Read Button -->
        @if (notification.status === "UNREAD") {
          <button
            type="button"
            (click)="onMarkAsReadClick($event)"
            (keydown.enter)="onMarkAsReadClick($event)"
            (keydown.space)="onMarkAsReadClick($event); $event.preventDefault()"
            class="text-xs text-blue-600 hover:text-blue-800 font-medium focus:outline-none focus:underline"
            aria-label="Marquer comme lue"
          >
            Marquer comme lue
          </button>
        }

        <!-- Delete Button -->
        <button
          type="button"
          (click)="onDeleteClick($event)"
          (keydown.enter)="onDeleteClick($event)"
          (keydown.space)="onDeleteClick($event); $event.preventDefault()"
          class="text-xs text-red-600 hover:text-red-800 font-medium focus:outline-none focus:underline"
          aria-label="Supprimer la notification"
        >
          Supprimer
        </button>
      </div>
    </div>
  </div>
</div>
