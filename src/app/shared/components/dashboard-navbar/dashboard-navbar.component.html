      <div class="flex items-center gap-3">
        <div
          class="w-10 h-10 bg-white rounded-full flex items-center justify-center"
        >
          <svg
            class="w-6 h-6"
            viewBox="0 0 50 50"
            xmlns="http://www.w3.org/2000/svg"
          >
            <path
              d="M 15 15 L 15 35 L 25 30 L 35 35 L 35 15 L 25 20 Z"
              fill="#764ba2"
            />
          </svg>
        </div>
        <div class="text-white">
          <h1 class="text-xl font-bold">KLASSIO</h1>
          <p class="text-xs text-purple-100">{{ title() }}</p>
        </div>
      </div>

      <div class="flex items-center gap-4">
        @if (showNotifications()){
        <button
          class="text-white hover:text-purple-100 transition-colors relative"
        >
          <svg
            class="w-6 h-6"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"
            />
          </svg>
          @if (notificationCount() > 0) {
          <span
            class="absolute top-0 right-0 w-2 h-2 bg-red-500 rounded-full"
          ></span>
          }
        </button>
        }
        <div
          class="relative"
          (click)="toggleDropdown()"
          (keypress)="toggleDropdown()"
        >
          <div
            class="flex items-center gap-3 pl-4 border-l border-purple-400 cursor-pointer"
            (keydown.enter)="toggleDropdown()"
            (keydown.space)="$event.preventDefault(); toggleDropdown()"
            (keydown.escape)="closeDropdown()"
          >
            <div class="text-right">
              <p class="text-white font-semibold text-sm">{{ fullName() }}</p>
              <p class="text-purple-100 text-xs">
                {{ getDashboardSubtitle() }}
              </p>
            </div>
            <div
              class="w-10 h-10 bg-white rounded-full flex items-center justify-center"
            >
              <span class="text-purple-600 font-bold">{{ initials() }}</span>
            </div>
          </div>

          @if (showDropdown()) {
          <div
            class="absolute right-0 top-14 w-48 bg-white rounded-lg shadow-lg border border-gray-200 z-50"
          >
            <button
              (click)="onSettingsClick()"
              class="w-full px-4 py-3 text-left text-gray-700 hover:bg-gray-50 flex items-center gap-3 transition-colors cursor-pointer"
            >
              <svg
                class="w-5 h-5"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"

              </svg>

            </button>
            <div class="border-t border-gray-200"></div>
            <button
              (click)="onLogoutClick()"
              class="w-full px-4 py-3 text-left text-red-600 hover:bg-red-50 flex items-center gap-3 transition-colors cursor-pointer"
            >
              <svg
                class="w-5 h-5"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M17 16l4-4m0 0l-4 4m4-4H9m6 0v4H9m-6 0V9a2 2 0 10-4 0v4a2 2 0 002 2h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2z"
