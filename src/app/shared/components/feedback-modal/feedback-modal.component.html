<div
  class="modal-overlay"
  role="dialog"
  aria-modal="true"
  aria-labelledby="feedback-modal-title"
  (click)="onCancel()"
  (keydown.escape)="onCancel()"
  tabindex="-1"
>
  <div
    class="modal-content"
    role="document"
    (click)="$event.stopPropagation()"
    (keydown)="$event.stopPropagation()"
    tabindex="0"
  >
    <div class="modal-header">
      <h2 id="feedback-modal-title">Terminer le cours</h2>
      <button
        type="button"
        class="close-btn"
        (click)="onCancel()"
        aria-label="Fermer la modale"
      >
        ×
      </button>
    </div>

    <div class="modal-body">
      <div class="form-group">
        <label for="notionsCovered">
          Notions abordées
          <span class="optional">(optionnel)</span>
        </label>
        <textarea
          id="notionsCovered"
          name="notionsCovered"
          [(ngModel)]="notionsCoveredValue"
          (ngModelChange)="notionsCovered.set($event)"
          placeholder="Ex: Théorème de Pythagore, équations du second degré..."
          rows="3"
          maxlength="500"
          aria-describedby="notions-char-count"
        ></textarea>
        <div id="notions-char-count" class="char-count" aria-live="polite">
          {{ notionsCovered().length }}/500
        </div>
      </div>

      <div class="form-group">
        <label for="teacherFeedback">
          Appréciation / Commentaire
          <span class="required" aria-label="requis">*</span>
        </label>
        <textarea
          id="teacherFeedback"
          name="teacherFeedback"
          [(ngModel)]="teacherFeedbackValue"
          (ngModelChange)="teacherFeedback.set($event)"
          placeholder="Votre appréciation sur la séance, le comportement de l'élève, les progrès réalisés..."
          rows="5"
          maxlength="1000"
          required
          aria-required="true"
          aria-describedby="feedback-char-count"
          [attr.aria-invalid]="
            !isValid() && teacherFeedback().length > 0 ? 'true' : null
          "
        ></textarea>
        <div id="feedback-char-count" class="char-count" aria-live="polite">
          {{ teacherFeedback().length }}/1000
        </div>
      </div>

      @if (errorMessage()) {
        <div class="error-message" role="alert" aria-live="assertive">
          {{ errorMessage() }}
        </div>
      }
    </div>

    <div class="modal-footer">
      <button type="button" class="btn btn-secondary" (click)="onCancel()">
        Annuler
      </button>
      <button
        type="button"
        class="btn btn-primary"
        (click)="onSubmit()"
        [disabled]="!isValid()"
        [attr.aria-disabled]="!isValid()"
      >
        Valider et terminer
      </button>
    </div>
  </div>
</div>
