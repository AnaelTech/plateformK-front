<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>Klassio</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#2563eb" />
    <meta name="msapplication-TileColor" content="#2563eb" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Klassio" />
    <link rel="icon" type="image/x-icon" href="favicon.png" />
    <link rel="apple-touch-icon" href="icons/icon-192x192.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <script>
      // Polyfill `global` requis par sockjs-client (équivalent navigateur de globalThis).
      window.global = window;
    </script>
    <!-- Applique le mode sombre enregistré avant le rendu (évite le flash) -->
    <script>
      try {
        var klassioTheme = localStorage.getItem('klassio-theme');
        var klassioDark =
          klassioTheme === 'dark' ||
          (klassioTheme === null &&
            window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', klassioDark);
        document.documentElement.style.colorScheme = klassioDark
          ? 'dark'
          : 'light';
      } catch (e) {}
    </script>
  </head>
  <body>
    <app-root></app-root>
    <noscript
      >Veuillez activer JavaScript pour utiliser cette application.</noscript
    >
  </body>
</html>
