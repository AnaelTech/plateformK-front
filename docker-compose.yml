version: "3.8"

networks:
  plateformk-network:
    driver: bridge

services:
  frontend:
    build:
      context: .
      dockerfile: Containerfile.dev
    container_name: plateformk-frontend-dev
    networks:
      - plateformk-network
    ports:
      - "4200:4200"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
    command: npm start
